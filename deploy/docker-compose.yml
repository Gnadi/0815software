# Reference deployment: one full platform stack for ONE customer
# (see docs/DEPLOYMENT-MODEL.md — isolation is at the deployment boundary).
#
#   cp .env.example .env        # then fill in generated secrets (see comments)
#   docker compose up -d --build
#
# Caddy terminates TLS and routes per-service subpaths; the ticker sidecar
# drives the queue/scheduler services; nightly backups via ../deploy/backup.sh
# from the host's cron. NODE_ENV=production makes every service's boot guard
# refuse default secrets, so an unconfigured stack cannot start.

x-service: &service
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
  networks: [platform]

services:
  ps01:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-01-identity } }
    environment:
      NODE_ENV: production
      PORT: "4001"
      SELF_BASE_URL: https://${PLATFORM_DOMAIN}/identity
    volumes: [ps01-data:/data]
    healthcheck: &hc
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  ps02:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-02-workflow-engine } }
    environment: &downstream-env
      NODE_ENV: production
      IDENTITY_URL: http://ps01:4001
    volumes: [ps02-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4002/api/ready"] }
    depends_on: [ps01]

  ps03:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-03-notification-hub } }
    environment: *downstream-env
    volumes: [ps03-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4003/api/ready"] }
    depends_on: [ps01]

  ps04:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-04-ai-platform } }
    environment: *downstream-env
    volumes: [ps04-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4004/api/ready"] }
    depends_on: [ps01]

  ps05:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-05-integration-hub } }
    environment: *downstream-env
    volumes: [ps05-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4005/api/ready"] }
    depends_on: [ps01]

  ps06:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-06-file-storage } }
    environment: *downstream-env
    volumes: [ps06-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4006/api/ready"] }
    depends_on: [ps01]

  ps07:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-07-audit-log } }
    environment: *downstream-env
    volumes: [ps07-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4007/api/ready"] }
    depends_on: [ps01]

  ps08:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-08-payments } }
    environment: *downstream-env
    volumes: [ps08-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4008/api/ready"] }
    depends_on: [ps01]

  ps09:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-09-search } }
    environment: *downstream-env
    volumes: [ps09-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4009/api/ready"] }
    depends_on: [ps01]

  ps10:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ps-10-number } }
    environment: *downstream-env
    volumes: [ps10-data:/data]
    healthcheck: { <<: *hc, test: ["CMD", "wget", "-qO-", "http://localhost:4010/api/ready"] }
    depends_on: [ps01]

  # TLS termination + per-service routing.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [platform]
    depends_on: [ps01, ps02, ps03, ps04, ps05, ps06, ps07, ps08, ps09, ps10]

  # Drives the queue/scheduler services once a minute (PS-02/03/05/08 ticks).
  ticker:
    image: curlimages/curl:latest
    restart: unless-stopped
    env_file: .env
    networks: [platform]
    depends_on: [ps02, ps03, ps05, ps08]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for url in http://ps02:4002/api/tick http://ps03:4003/api/tick http://ps05:4005/api/tick http://ps08:4008/api/tick; do
            curl -fsS -X POST "$$url" -H "X-Service-Token: $$SERVICE_TOKEN" >/dev/null || echo "tick failed: $$url"
          done
          sleep 60
        done

networks:
  platform: {}

volumes:
  ps01-data: {}
  ps02-data: {}
  ps03-data: {}
  ps04-data: {}
  ps05-data: {}
  ps06-data: {}
  ps07-data: {}
  ps08-data: {}
  ps09-data: {}
  ps10-data: {}
  caddy-data: {}
  caddy-config: {}
