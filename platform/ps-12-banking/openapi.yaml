openapi: 3.1.0
info:
  title: PS-12 Banking API
  version: '0.1.0'
  description: >-
    EBICS 3.0 (H005) bank transport: subscriber key custody, the INI/HIA/HPB key
    exchange, and signed ISO 20022 uploads over the customer's own bank
    connection. Request and response bodies are typed in
    @0815software/platform-clients; this document is the endpoint + auth surface.


    Two kinds of caller, and the split is deliberate. Everything to do with keys
    needs an **admin session** — a human. A module presenting `X-Service-Token`
    may submit and read orders, and nothing else: it cannot create a connection,
    activate one, or lift its own ceilings. At signature class E a submitted
    order is money gone, so the blast radius of a leaked service token is
    bounded by limits a human set on a connection a human activated.


    Private key material has no route. Digests are the only thing about a key
    that ever leaves the process.
servers:
  - url: http://localhost:4012
    description: Local / per-customer deployment (behind Caddy in production)
tags:
  - name: ps-12-banking
paths:
  /api/health:
    get:
      summary: Get health
      tags: [ps-12-banking]
      security: []
      responses:
        '200': { description: Success }
  /api/ready:
    get:
      summary: Get ready
      tags: [ps-12-banking]
      security: []
      responses:
        '200': { description: Success }
        '503': { description: Database unreachable or migrations pending }
  /api/metrics:
    get:
      summary: Get metrics
      tags: [ps-12-banking]
      security: []
      responses:
        '200': { description: Success }
  /api/login:
    post:
      summary: Create login
      tags: [ps-12-banking]
      security: []
      responses:
        '200': { description: Success }
        '401': { description: Invalid username or password }
  /api/logout:
    post:
      summary: Create logout
      tags: [ps-12-banking]
      security: []
      responses:
        '200': { description: Success }
  /api/banks:
    get:
      summary: List bank profiles
      description: >-
        BTF conventions per scheme and country. No URLs and no host ids: those
        come from the EBICS contract the bank sends the customer. Every profile
        ships `confirmed: false` until a human has checked it against a bank's
        own documentation.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /api/connections:
    get:
      summary: List connections
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
        '403': { description: A service token cannot reach an operator's route }
    post:
      summary: Create connection
      description: >-
        key, display_name, bank_key, url, host_id, partner_id and user_id come from the EBICS contract.
        Optional: es_version (A005 or A006), debtor_iban, max_amount_minor, max_transfers, and the
        EBICS Product element as product_name / product_language (ISO 639, required with a name) /
        product_institute_id. Omit the product fields and no Product element is sent.
        request_eds (default false) makes uploads carry SignatureFlag requestEDS="true", asking the bank
        to spool them into its distributed-signature (VEU/EDS) queue.
        vop selects Verification of Payee: "default" (no ServiceOption, the market default decides),
        "opt_out" (VOO) or "opt_in" (VOI).
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '201': { description: Created }
        '409': { description: A connection with this key already exists }
        '422': { description: Validation failed (including an unknown bank profile) }
  /api/connections/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get connection
      description: The folded state, the key digests, the bank's key digests and the event stream.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
        '404': { description: No such connection }
  /api/connections/{key}/keys:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Generate the three key pairs
      description: >-
        ES (A005/A006), authentication (X002) and encryption (E002). Once only —
        a second call would orphan the copy the bank already holds. Returns
        digests; the private keys never leave the service.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '201': { description: Created }
        '500': { description: This connection already has keys }
  /api/connections/{key}/versions:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Ask the bank which EBICS versions it speaks (HEV)
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
        '502': { description: The bank did not answer usefully }
  /api/connections/{key}/ini:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Send the signature key (INI)
      description: An unsecured message — it cannot be otherwise, since the bank holds no key of ours yet. The INI letter is what binds it to a customer.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
        '409': { description: Out of order for this connection's state }
  /api/connections/{key}/hia:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Send the authentication and encryption keys (HIA)
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
        '409': { description: Out of order for this connection's state }
  /api/connections/{key}/hpb:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Fetch the bank's public keys (HPB)
      description: >-
        Moves the connection to `hpb_fetched`, never to `ready`. Re-fetching
        clears an earlier confirmation, because inheriting a human's tick for
        keys nobody looked at is how a substituted key would wear someone
        else's approval.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
  /api/connections/{key}/ini-letter.pdf:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download the INI and HIA letters
      description: Two pages carrying the key digests, to be printed, signed by hand and posted. Digests only — never key material.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: A PDF }
        '409': { description: This connection has no keys yet }
  /api/connections/{key}/verify-bank-keys:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Confirm the bank's key digests, activating the connection
      description: >-
        The one human judgement in the service. HPB cannot prove the keys came
        from the bank, so an operator compares the digests against the bank's
        own published letter. A mismatch is recorded as an event and the
        connection stays unusable — it is what an attacker in the middle looks
        like.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The connection is now ready }
        '422': { description: The digests do not match what was fetched }
  /api/connections/{key}/lock:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Lock the subscriber at the bank (SPR)
      description: >-
        Revokes this subscriber's authorisation AT THE BANK. Unlike /suspend this cannot be undone from
        here: the way back is new keys and a fresh INI/HIA. The connection moves to "locked" only when the
        bank answered EBICS_OK; a refusal is recorded as failed and answered 502. Body: {reason}.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Locked }
        '409': { description: Already locked, or the bank keys have not been fetched yet }
        '502': { description: The bank refused — the subscriber is NOT locked }
  /api/connections/{key}/veu:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
      - name: details
        in: query
        description: "1 asks with HVZ instead of HVU — the same list with amounts, accounts and digests filled in"
        schema: { type: string }
    get:
      summary: What is waiting in the bank's distributed-signature queue (HVU/HVZ)
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The queue, empty when nothing is waiting }
  /api/connections/{key}/veu/detail:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: One queued order's digest, display file and signers (HVD)
      description: "Body: {btf, order_id, partner_id?}."
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The order }
        '404': { description: The bank has no such order waiting }
  /api/connections/{key}/veu/transactions:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: The individual payments inside a queued collective order (HVT)
      description: "Body: {btf, order_id, partner_id?, complete_order_data?, limit?, offset?}."
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The transactions }
  /api/connections/{key}/veu/sign:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Add our signature to a queued order (HVE)
      description: >-
        Body: {btf, order_id, partner_id?}. The digest that gets signed is fetched from the bank with HVD
        immediately beforehand and is NEVER taken from this body — a service that signed a caller-supplied
        digest would be a signing oracle for any document at all.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Signed, with the digest that was signed }
        '404': { description: The bank has no such order waiting }
        '502': { description: The bank refused the signature }
  /api/connections/{key}/veu/cancel:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Cancel a queued order (HVS)
      description: "Body: {btf, order_id, partner_id?}. The digest is fetched with HVD, as for /sign."
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Cancelled }
        '404': { description: The bank has no such order waiting }
  /api/connections/{key}/customer-data:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
      - name: scope
        in: query
        description: "\"customer\" asks with HKD (every subscriber); anything else asks with HTD (this one)"
        schema: { type: string }
    get:
      summary: What the bank says this customer may do (HTD/HKD)
      description: >-
        The bank's own list of the order types and BTFs it has enabled for THIS contract, the accounts they
        apply to, the signatures each needs, and per subscriber the signature class held and any ceiling the
        bank enforces. Authoritative in a way no published mapping table is. The response adds
        `available_downloads`: the BTD entries, in exactly the shape POST /subscriptions takes.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The customer data }
        '502': { description: The bank has not enabled that order type }
  /api/connections/{key}/bank-parameters:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: What this bank supports (HPD)
      description: >-
        Access parameters and the EBICS, authentication, encryption and signature versions the bank speaks.
        The cheapest compatibility check there is. A flag present without its `supported` attribute means
        SUPPORTED — the schema's own default.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The bank's parameters }
  /api/connections/{key}/waiting:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: The BTFs the bank has files waiting for right now (HAA)
      description: >-
        A different question from /customer-data: that says what this customer is PERMITTED to fetch, this
        says what is ACTUALLY there. An empty list is the ordinary answer.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The BTFs with data waiting }
  /api/connections/{key}/subscriptions:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Which BTFs the tick fetches on this connection
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The subscriptions, with what the last poll did }
    post:
      summary: Fetch one more BTF on every tick
      description: >-
        Body: {btf, label?, lookback_days?, enabled?}. Any BTF at all — a new connection starts with its
        profile's status report and statement, and everything beyond that is this. Use /customer-data to
        find out what the bank actually offers rather than guessing.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '201': { description: Created }
        '409': { description: This connection already fetches that BTF }
        '422': { description: A BTF needs at least a service name and a message name }
  /api/connections/{key}/subscriptions/{id}/enable:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Resume polling one BTF
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The subscription }
        '404': { description: No such subscription on this connection }
  /api/connections/{key}/subscriptions/{id}/disable:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Stop polling one BTF, without forgetting it
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The subscription }
        '404': { description: No such subscription on this connection }
  /api/connections/{key}/key-change:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      summary: The keys prepared for a change but not yet in force
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The pending keys — digests only, never key material }
    post:
      summary: Replace this connection's keys over the wire (HCA/HCS)
      description: >-
        Body: {include_signature?}. False (the default) sends HCA and replaces the authentication and
        encryption keys; true sends HCS and replaces the ES key as well — the one that authorises payments.
        The request is signed with the keys the bank already holds, and that signature is the authorisation,
        so no second paper letter is needed. The replacements are committed as PENDING before the request
        goes out and promoted only once the bank accepts: the unrecoverable failure is the bank moving to a
        key this service does not hold. A refusal leaves them pending rather than discarding them, because a
        refusal at the transfer phase is ambiguous from this side.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Changed, with the keys now in force }
        '409': { description: A pending change for a different order type is in the way }
        '502': { description: The bank refused — the keys were NOT changed }
    delete:
      summary: Discard a pending key change
      description: >-
        Only safe once the bank has confirmed the change did NOT go through: discarding after an acceptance
        destroys the only copy of the key the bank has moved to.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '204': { description: Discarded }
        '409': { description: There is no pending key change }
  /api/connections/{key}/key-change/complete:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Promote a pending change the bank accepted but this service never recorded
      description: >-
        The recovery for a crash between the bank's acceptance and our commit. Deliberately explicit rather
        than inferred: an operator must have established WITH THE BANK that the change went through, because
        getting it wrong leaves every later message signed with a key the bank has retired.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The keys now in force }
        '409': { description: There is no pending key change }
  /api/connections/{key}/subscriptions/{id}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Stop fetching one BTF entirely
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '204': { description: Removed }
        '404': { description: No such subscription on this connection }
  /api/connections/{key}/suspend:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Suspend a connection
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
  /api/connections/{key}/resume:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Resume a suspended connection
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: Success }
  /api/connections/{key}/clear-failure:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Step a connection back out of `failed` so setup can be retried
      description: >-
        A bank refusing a setup message records a `failed` event, and plenty of
        those are transient — a host that was down, a subscriber the bank had
        not activated yet. This moves the connection BACKWARDS to the last step
        it actually completed, so clearing a failure can never be a route to
        `ready` without a human confirming the bank's digests.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The connection, back at its last completed step }
        '409': { description: This connection has not failed }
  /api/orders:
    get:
      summary: List orders
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      parameters:
        - name: connection
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
    post:
      summary: Submit a file to the bank
      description: >-
        Payload-agnostic: bytes, a BTF and an idempotency key. Deduplicated
        twice — on the caller's key, and on the file's own MsgId per connection.
        Ceilings are enforced here, before anything is signed. A `201` is a new
        order; a `200` means an earlier submission of the same file produced it.


        The response carries the order either way, accepted or rejected or
        failed, because a caller needs the id to record the outcome against its
        own record.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      parameters:
        - name: validate
          in: query
          description: '`1` for a dry run — reports what would be sent, signs nothing and stores nothing.'
          schema: { type: string, enum: ['1'] }
      responses:
        '200': { description: An earlier submission of this file }
        '201': { description: Submitted }
        '409': { description: The connection is not ready, or this MsgId belongs to an order that is not finished }
        '422': { description: Outside this connection's ceilings, or an unreadable payload }
  /api/orders/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get order
      description: The folded status and the full event stream, including the bank's return codes.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: Success }
        '404': { description: No such order }
  /api/connections/{key}/fetch:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Fetch one BTF now
      description: >-
        An operator's button: ask the bank for one message type without waiting
        for the tick. Optionally scoped to an inclusive `date_range`.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: The download, or null when the bank had nothing waiting }
        '409': { description: The connection is not ready }
  /api/downloads:
    get:
      summary: List downloads
      description: >-
        Metadata only — the files themselves are on their own route, so a
        listing never carries megabytes of XML. `acknowledged_at` null means
        the bank has not been told we hold the file and will offer it again.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      parameters:
        - name: connection
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [statement, status, other] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /api/downloads/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get download
      description: >-
        The metadata plus, depending on the kind, what was read out of the file. `status`
        carries the payment statuses; `info` carries a CIM's notices; `protocol` carries
        `customer_protocol` — the bank's own log of what it did with each order, folded by
        EBICS order number with a verdict per order. Note that `status` and `protocol` are
        BOTH pain.002 documents: the kind is decided by the bytes, not by the BTF.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: Success }
        '404': { description: No such download }
  /api/downloads/{public_id}/content:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download the file itself
      description: >-
        The bytes the bank sent, stored whole. They stay the record even where the service has read
        them: a camt.053 is parsed into bookings (see /api/entries) and the original is still here,
        so a fix to the reader can be applied to statements already collected.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: The file }
        '404': { description: No such download }
  /api/statements:
    get:
      summary: The account statements read out of collected camt.053 files
      description: >-
        Metadata and balances, newest first. Entries are on the detail route, so a listing never drags
        thousands of bookings through a caller that only wanted to know what arrived.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      parameters:
        - name: connection
          in: query
          schema: { type: string }
        - name: account
          in: query
          description: An IBAN.
          schema: { type: string }
        - name: source
          in: query
          description: >-
            statement (camt.053), report (camt.052) or notification (camt.054). Unlike /api/entries this does
            NOT default — a list of what arrived is not a sum, so every message is the useful answer.
          schema: { type: string, enum: [statement, report, notification, any] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: The statements }
  /api/statements/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: One statement, with every booking on it
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: The statement and its entries }
        '404': { description: No such statement }
  /api/statements/reparse:
    post:
      summary: Re-read every stored statement
      description: >-
        Drops the derived bookings and reads the stored bytes again, so a fix to the reader improves
        statements already collected and not only the next one. Body: {connection?}. Admin only —
        rebuilding derived rows is not a module's call.
      tags: [ps-12-banking]
      security: [{adminSession: []}]
      responses:
        '200': { description: How many downloads were queued for re-reading }
  /api/entries:
    get:
      summary: Find bookings — the query a payment matcher needs
      description: >-
        The service reads the bank's camt.053 and hands over what it booked. It does NOT decide which
        invoice a booking settles: that depends on the invoices, and those live in the module that
        issued them. Two defaults matter. Only `BOOK` entries come back, because a `PDNG` entry is
        money the bank has seen and not booked, and settling an invoice against one is how a payment
        gets counted that later vanishes. And `reversal` is on every entry — a returned direct debit
        undoes an earlier booking, so pass exclude_reversals when summing. Amounts are the exact
        string the bank sent, unsigned, with the direction in `credit`; `amount_hundredths` is that
        times one hundred and is NOT minor units (EUR 2, JPY 0, KWD 3 — that table is not shipped).
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      parameters:
        - name: connection
          in: query
          schema: { type: string }
        - name: account
          in: query
          description: An IBAN.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive, on the BOOKING date.
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: credit
          in: query
          description: 1 for money in, 0 for money out; omit for both.
          schema: { type: string }
        - name: status
          in: query
          description: Defaults to BOOK.
          schema: { type: string }
        - name: source
          in: query
          description: >-
            Which account message the bookings came from. DEFAULTS TO "statement" — the end-of-day camt.053.
            A camt.052 report ("report") and a camt.054 notification ("notification") carry bookings the day's
            statement carries again, so querying across all of them counts the same money twice. Pass "any"
            only if you mean it.
          schema: { type: string, enum: [statement, report, notification, any] }
        - name: end_to_end_id
          in: query
          description: The reference your own pain.001 put on the transaction.
          schema: { type: string }
        - name: reference
          in: query
          description: The structured creditor reference, matched exactly.
          schema: { type: string }
        - name: amount_hundredths
          in: query
          schema: { type: integer }
        - name: search
          in: query
          description: Substring of the remittance text or the counterparty name.
          schema: { type: string }
        - name: exclude_reversals
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: The bookings }
        '422': { description: A numeric parameter was not an integer in range }
  /api/tick:
    post:
      summary: Run the periodic work
      description: >-
        Fetch what every ready connection has waiting, and fold any payment
        status reports back into the orders they are about. Answers 200 with
        `problems` listed rather than failing: one bank being unreachable must
        not stop the others being polled, and a scheduler calling this every
        minute needs an answer it can log.
      tags: [ps-12-banking]
      security: [{serviceToken: []}, {adminSession: []}]
      responses:
        '200': { description: '{downloads_fetched, orders_updated, problems}' }
        '401': { description: Authentication required }
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Shared machine secret. Orders only — it cannot reach any route that touches keys.
    adminSession:
      type: http
      scheme: bearer
      description: A local admin session token, or a PS-01 session holding platform:admin via the identity seam.
